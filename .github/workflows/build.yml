name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build SampleOrleans.slnx --configuration Release

      - name: Run the demo
        run: dotnet run --project src/SampleOrleans.Host --configuration Release --no-build
